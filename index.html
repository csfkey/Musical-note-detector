<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Audio Reactive Visualizer</title>

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
    font-family:Arial, sans-serif;
}

canvas{
    position:absolute;
    inset:0;
}

#panel{
    position:fixed;
    top:20px;
    left:20px;
    z-index:10;

    padding:15px;
    border-radius:15px;

    background:rgba(0,0,0,.4);
    color:white;

    backdrop-filter:blur(20px);
}

button{
    padding:10px 20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

</style>
</head>
<body>

<div id="panel">
    <h3>Audio Reactive Visualizer</h3>
    <button id="startBtn">
        Start Visualizer
    </button>
</div>

<canvas id="canvas"></canvas>

<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

function resize(){

    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
}

resize();

window.addEventListener(
    "resize",
    resize
);

let analyser;
let frequencyData;

const particles=[];

for(let i=0;i<700;i++){

    particles.push({

        x:Math.random()*window.innerWidth,
        y:Math.random()*window.innerHeight,

        vx:(Math.random()-0.5)*2,
        vy:(Math.random()-0.5)*2,

        size:Math.random()*3+1,
        angle:Math.random()*Math.PI*2
    });
}

function avg(arr,start,end){

    let sum=0;

    for(let i=start;i<end;i++){

        sum+=arr[i];
    }

    return sum/(end-start);
}

document
.getElementById("startBtn")
.onclick = async ()=>{

    try{

        const stream =
        await navigator.mediaDevices.getDisplayMedia({

            video:true,
            audio:true
        });

        const audioContext =
        new (window.AudioContext
        || window.webkitAudioContext)();

        const source =
        audioContext.createMediaStreamSource(
            stream
        );

        analyser =
        audioContext.createAnalyser();

        analyser.fftSize = 2048;

        frequencyData =
        new Uint8Array(
            analyser.frequencyBinCount
        );

        source.connect(analyser);

        animate();

    }catch(err){

        alert(
        "Audio capture cancelled."
        );
    }
};

function drawBackground(hue,bass){

    let g =
    ctx.createRadialGradient(

        canvas.width/2,
        canvas.height/2,
        100,

        canvas.width/2,
        canvas.height/2,
        canvas.width
    );

    g.addColorStop(
        0,
        `hsla(${hue},
        100%,
        60%,
        0.8)`
    );

    g.addColorStop(
        .5,
        `hsla(${(hue+120)%360},
        100%,
        40%,
        0.3)`
    );

    g.addColorStop(
        1,
        `hsla(${(hue+240)%360},
        100%,
        10%,
        0.15)`
    );

    ctx.fillStyle=g;
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );
}

function animate(){

    requestAnimationFrame(
        animate
    );

    if(!analyser) return;

    analyser.getByteFrequencyData(
        frequencyData
    );

    const bass =
    avg(frequencyData,2,40);

    const mids =
    avg(frequencyData,40,150);

    const highs =
    avg(frequencyData,150,400);

    const hue =
    (
        bass*2 +
        mids +
        performance.now()*0.03
    ) % 360;

    drawBackground(
        hue,
        bass
    );

    particles.forEach(p=>{

        p.angle +=
        0.01 +
        bass*0.0005;

        p.x +=
        Math.cos(p.angle)
        *
        (
            p.vx +
            bass*0.02
        );

        p.y +=
        Math.sin(p.angle)
        *
        (
            p.vy +
            bass*0.02
        );

        if(p.x<0)
            p.x=canvas.width;

        if(p.x>canvas.width)
            p.x=0;

        if(p.y<0)
            p.y=canvas.height;

        if(p.y>canvas.height)
            p.y=0;

        ctx.beginPath();

        ctx.fillStyle=
        `hsla(
            ${(hue+highs)%360},
            100%,
            75%,
            .8
        )`;

        ctx.arc(

            p.x,
            p.y,

            p.size+(bass/80),

            0,
            Math.PI*2
        );

        ctx.fill();
    });

    const centerX =
    canvas.width/2;

    const centerY =
    canvas.height/2;

    for(let i=0;i<35;i++){

        const radius =
        120 +
        i*22 +
        bass*2;

        const angle =

        performance.now()
        *0.001

        +

        i*0.35

        +

        mids*0.004;

        const x =

        centerX +

        Math.cos(angle)
        * radius;

        const y =

        centerY +

        Math.sin(angle)
        * radius;

        ctx.strokeStyle=
        `hsla(
        ${hue+i*10},
        100%,
        70%,
        .5
        )`;

        ctx.lineWidth=2;

        ctx.beginPath();

        ctx.moveTo(
            centerX,
            centerY
        );

        ctx.lineTo(
            x,
            y
        );

        ctx.stroke();

        ctx.beginPath();

        ctx.arc(

            x,
            y,

            10+
            highs/20,

            0,
            Math.PI*2
        );

        ctx.stroke();
    }

    ctx.beginPath();

    ctx.lineWidth=
    10 +
    bass/20;

    ctx.strokeStyle=
    `hsla(
    ${hue},
    100%,
    85%,
    .9
    )`;

    ctx.arc(

        centerX,
        centerY,

        100
        +
        bass*2,

        0,
        Math.PI*2
    );

    ctx.stroke();

    const bars=300;

    const w=
    canvas.width/bars;

    for(let i=0;i<bars;i++){

        const index =
        Math.floor(

            i*
            frequencyData.length
            /
            bars
        );

        const v=
        frequencyData[index];

        const h=
        v*1.5;

        ctx.fillStyle=
        `hsl(
            ${hue+i},
            100%,
            60%
        )`;

        ctx.fillRect(

            i*w,

            canvas.height-h,

            w,

            h
        );
    }
}

</script>
</body>
</html>
